# PostgreSQL + MCP server for auto_grocier — portable, no host install required.
#
# Brings up the database the app expects (db auto_grocier, user grocier_user) so
# the app's .env settings work unchanged, plus the MCP server in its own
# container. Starting the MCP server auto-starts Postgres first (depends_on +
# healthcheck).
#
# Usage (from the repo root):
#   docker compose -f docker/docker-compose.yml up -d postgres   # just the DB
#   docker compose -f docker/docker-compose.yml build mcp        # build MCP image
#   docker compose -f docker/docker-compose.yml run --rm mcp     # run MCP (stdio)
#   docker compose -f docker/docker-compose.yml down             # stop (keeps data)
#   docker compose -f docker/docker-compose.yml down -v          # stop + wipe data
#
# The MCP server is launched by VS Code via .vscode/mcp.json using
# `docker compose run` so it speaks MCP over stdio and Postgres comes up first.
#
# All configuration is read from the repo-root .env (see .env.example). DB
# credentials default to the .env values but can be overridden via the
# environment (DATABASE_USER / DATABASE_PASSWORD / DATABASE_NAME / DATABASE_PORT).

services:
  postgres:
    image: postgres:16
    container_name: auto_grocier_db
    restart: unless-stopped
    # NOTE: DATABASE_PASSWORD must be present in the compose INTERPOLATION
    # environment (host env, docker/.env, or the repo-root .env when running from
    # the repo root) — this is distinct from the container env_file mounted below.
    # Postgres bakes POSTGRES_PASSWORD into the auto_grocier_pgdata volume at first
    # init, so a volume created under an earlier password keeps THAT password. To
    # adopt a new one, either set DATABASE_PASSWORD to the previously-baked value,
    # or recreate the volume with `docker compose -f docker/docker-compose.yml
    # down -v` (which wipes local DB data — re-seed afterward).
    environment:
      POSTGRES_USER: ${DATABASE_USER:-grocier_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set — see .env.example}
      POSTGRES_DB: ${DATABASE_NAME:-auto_grocier}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - auto_grocier_pgdata:/var/lib/postgresql/data
      # Migrations run once, in order (001, 002, 003), when the data volume is
      # first created. Mounted read-only straight from the repo so there is no
      # duplicated SQL to keep in sync.
      - ../src/auto_grocier/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-grocier_user} -d ${DATABASE_NAME:-auto_grocier}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    image: auto_grocier_mcp
    container_name: auto_grocier_mcp
    # Starting the MCP server brings Postgres up first and waits for it healthy.
    depends_on:
      postgres:
        condition: service_healthy
    # All app settings come from the repo-root .env (HEB + Gmail creds, store,
    # Claude key, etc). Real environment vars below still take precedence.
    env_file:
      - ../.env
    environment:
      # Reach Postgres over the compose network (service name "postgres"),
      # overriding the .env DATABASE_HOST (localhost) without editing it.
      DATABASE_URL: postgresql://${DATABASE_USER:-grocier_user}:${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set — see .env.example}@postgres:5432/${DATABASE_NAME:-auto_grocier}
      # In-container login uses the nodriver (Xvfb) flow with no Chrome sandbox.
      AUTO_GROCIER_NO_SANDBOX: "1"
      AUTO_GROCIER_AUTO_LOGIN: "1"
      NODRIVER_BROWSER_PATH: /usr/bin/chromium
      DISPLAY: ":99"
    volumes:
      # App configuration + credentials (read-only) — not baked into the image.
      # claude.py / read_email.py call load_dotenv on this file directly.
      - ../.env:/app/.env:ro
      # Self-healing rewrites: the nodriver flows save Claude-repaired functions
      # to session_maintenance/updated_functions/. The image bakes the code in
      # (COPY . .) and the server runs with `--rm`, so without this bind mount
      # those rewrites would vanish when the container exits. Mounting the host
      # directory makes them land in the working tree for review + commit.
      - ../src/auto_grocier/session_maintenance/updated_functions:/app/src/auto_grocier/session_maintenance/updated_functions
      # Persisted HEB session (auth.json + persisted_queries.json). Survives
      # restarts so the container doesn't re-login every time.
      - auto_grocier_session:/root/.texas-grocery-mcp
    # MCP stdio server: keep stdin open and don't allocate a TTY.
    stdin_open: true
    tty: false
    # No restart policy: this is launched on-demand by the MCP client via
    # `docker compose run --rm mcp`.

volumes:
  auto_grocier_pgdata:
    name: auto_grocier_pgdata
  auto_grocier_session:
    name: auto_grocier_session
