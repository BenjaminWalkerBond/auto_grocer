name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        # Scoped to actively-maintained code + tests. The vendored
        # texas_grocery_mcp library and legacy scripts are excluded/untargeted;
        # a repo-wide lint cleanup is tracked separately.
        run: ruff check mcp_server.py utility/graphql_cart.py tests/

      - name: Run unit tests
        # Unit tests only; integration tests need a live HEB session and are
        # skipped unless --run-integration is passed.
        run: pytest tests/unit -v
