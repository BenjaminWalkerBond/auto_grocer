name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        # Repo-wide lint gate. The vendored auto_grocer_mcp library and the
        # generated session_maintenance/updated_functions fragments are excluded
        # via pyproject.toml [tool.ruff] extend-exclude.
        run: uv run ruff check .

      - name: Run unit tests
        # Full unit suite. On ubuntu the POSIX 0o600 permission tests run and
        # pass; integration tests need a live HEB session and are skipped unless
        # --run-integration is passed.
        run: uv run pytest tests/unit

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Type check (mypy)
        # First-party source only; auto_grocer_mcp and friends are excluded via
        # [tool.mypy] in pyproject.toml.
        # Enforced gate: mypy runs on the full first-party scope (the
        # src/auto_grocer package, including session_maintenance) plus the
        # root main.py entrypoint, and MUST report zero errors. A mypy failure
        # fails the job. Achieved via genuine SQLAlchemy 2.0 typing + real
        # annotations, not blanket suppression.
        run: uv run mypy src/auto_grocer main.py
